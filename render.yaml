services:
  - type: web
    name: kazoku-dojo
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: KAZOKU_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kazoku-dojo-db
          property: connectionString

databases:
  - name: kazoku-dojo-db
    databaseName: kazokukadojo
    user: kazoku
    plan: 0.1c-256mb
    region: ohio
    diskSizeGB: 1
