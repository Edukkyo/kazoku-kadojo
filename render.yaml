services:
  - type: web
    name: kazoku-dojo
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: KAZOKU_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
